<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">
    <title>View Use Case</title>
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${usecase.name}">Use Case Name</h2>
    <hr>

    <div class="card shadow-sm mb-4">
        <div class="card-header"><h5 class="mb-0">Details</h5></div>
        <div class="card-body">
            <p><strong>Actor:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'actor'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${usecase.actor}"></p>
                <a th:href="@{/usecase/view/{id}(id=${usecase.id}, edit='actor')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="actor"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'actor'}">
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="actor"/>
                    <input type="text" name="value" class="form-control mb-2 col-6"
                           th:value="${usecase.actor}"/>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/usecase/view/{id}(id=${usecase.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>
            <hr>
            <p><strong>Preconditions:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'preconditions'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${usecase.preconditions}"></p>
                <a th:href="@{/usecase/view/{id}(id=${usecase.id}, edit='preconditions')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="preconditions"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'preconditions'}">
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="preconditions"/>
                    <textarea name="value" class="form-control mb-2 col-6" rows="3"
                              th:text="${usecase.preconditions}"></textarea>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/usecase/view/{id}(id=${usecase.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>
            <hr>

            <p><strong>Main Flow:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'main_flow'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${usecase.main_flow}"></p>
                <a th:href="@{/usecase/view/{id}(id=${usecase.id}, edit='main_flow')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="main_flow"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'main_flow'}">
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="main_flow"/>
                    <textarea name="value" class="form-control mb-2 col-6" rows="3"
                              th:text="${usecase.main_flow}"></textarea>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/usecase/view/{id}(id=${usecase.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>
            <hr>

            <p><strong>Postconditions:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'postconditions'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${usecase.postconditions}"></p>
                <a th:href="@{/usecase/view/{id}(id=${usecase.id}, edit='postconditions')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="postconditions"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'postconditions'}">
                <form th:action="@{/usecase/update/{id}(id=${usecase.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="postconditions"/>
                    <textarea name="value" class="form-control mb-2 col-6" rows="3"
                              th:text="${usecase.postconditions}"></textarea>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/usecase/view/{id}(id=${usecase.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>

        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header"><h5 class="mb-0">Alternative Flows</h5></div>
        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(alternativeFlows)}">
                        <td colspan="3" class="text-muted text-center">No alternative flows yet.</td>
                    </tr>
                    <tr th:each="flow, iter : ${alternativeFlows}">
                        <td class="align-middle" th:text="${iter.count}"></td>
                        <td class="align-middle" th:text="${flow.description}"></td>
                        <td class="align-middle">
                            <form th:action="@{/alternativeflow/delete/{id}(id=${flow.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this flow?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer">
            <form th:action="@{/alternativeflow/add/{id}(id=${usecase.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label class="form-label"><strong>Add Alternative Flow</strong></label>
                <textarea name="description" class="form-control mb-2" rows="2"
                          placeholder="Describe the alternative flow..." required></textarea>
                <button type="submit" class="btn btn-secondary btn-sm">+ Add</button>
            </form>
        </div>
    </div>
	
	<div class="card shadow-sm mb-4">
	    <div class="card-header"><h5 class="mb-0">Linked CRC Cards</h5></div>
	    <div class="card-body p-0">
	        <table class="table table-hover table-bordered text-center mb-0">
	            <thead>
	                <tr><th>Class Name</th><th>Action</th></tr>
	            </thead>
	            <tbody>
	                <tr th:if="${#lists.isEmpty(linkedCrcs)}">
	                    <td colspan="2" class="text-muted">No linked CRC cards.</td>
	                </tr>
	                <tr th:each="crc : ${linkedCrcs}">
	                    <td class="align-middle" th:text="${crc.name}"></td>
	                    <td class="align-middle">
							<form th:action="@{/usecase/unlink/{ucId}(ucId=${usecase.id})}" method="post" class="d-inline">
							    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
							    <input type="hidden" name="crcId" th:value="${crc.id}"/>
							    <button type="submit" class="btn btn-danger btn-sm"
							            onclick="return confirm('Unlink this CRC card?')">Unlink</button>
							</form>
	                    </td>
	                </tr>
	            </tbody>
	        </table>
	    </div>
	    <div class="card-footer" th:if="${!#lists.isEmpty(projectCrcs)}">
	        <form th:action="@{/usecase/link/{ucId}(ucId=${usecase.id})}" method="post">
	            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
	            <label><strong>Link CRC Card</strong></label>
	            <select name="crcId" class="form-control mb-2 col-6" required>
	                <option value="" disabled selected>Select a CRC card...</option>
	                <option th:each="crc : ${projectCrcs}" th:value="${crc.id}" th:text="${crc.name}"></option>
	            </select>
	            <button type="submit" class="btn btn-secondary btn-sm">+ Link</button>
	        </form>
	    </div>
	</div>

    <a th:href="@{/project/view_project/{id}(id=${usecase.project.id})}"
       class="btn btn-outline-secondary mb-4">&larr; Back to Project</a>

</div>
</body>
</html>
