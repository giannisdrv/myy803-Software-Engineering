<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">
    <title>Create Project</title>
</head>
<body>
<div class="container mt-4">
    <h2>Create New Project</h2>
    <hr>
    <form th:action="@{/project/create_project}" th:object="${project}" method="POST">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Project Name</label>
        <input type="text" th:field="*{name}" class="form-control mb-4 col-4" required/>
        <button type="submit" class="btn btn-info col-2">Save</button>
		<a th:href="@{/project/dashboard}" class = "btn btn-outline-secondary mb-1 col-2">&larr; Back to Profile Dashboard</a>
    </form>
	
</div>
</body>
</html>
