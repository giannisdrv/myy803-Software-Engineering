<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

	<title>User Dashboard</title>
</head>


<body>
<div class="container mt-4">

  <h2>Welcome to User Dashboard</h2>
  
  <br> <br> <hr> <br> <br>
  
  <h4>Username: <span th:text="${currentUser.username}"></span></h4>
  <h4>Full Name: <span th:text="${currentUser.name}"></span></h4>
  <h4>Email: <span th:text="${currentUser.email}"></span></h4>

	<br> <br> <hr> <br> <br>

    <p>
		<a th:href="@{/project/dashboard}" class="btn btn-primary btn-sm mb-3">View Projects</a>
    	<a th:href="@{/user/profile}" class="btn btn-primary btn-sm mb-3">Edit Profile</a>
    	<a th:href="@{/logout}" class="btn btn-danger btn-sm mb-3">Logout</a>
    
    </p>
</div>
  
  
</body>
</html>
