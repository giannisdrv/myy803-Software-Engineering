<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">
    <title>View Project</title>
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${project.name}">Project Name</h2>
    <hr>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Use Cases</h5>
                    <a th:href="@{/usecase/create/{id}(id=${project.id})}" class="btn btn-primary btn-sm">+ Add</a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover table-bordered text-center mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(useCases)}">
                                <td colspan="2" class="text-muted">No use cases yet.</td>
                            </tr>
                            <tr th:each="uc : ${useCases}">
                                <td class="align-middle" th:text="${uc.name}">Use Case Name</td>
                                <td class="align-middle">
                                    <a th:href="@{/usecase/view/{id}(id=${uc.id})}" class="btn btn-primary btn-sm">View</a>
                                    <form th:action="@{/usecase/delete/{id}(id=${uc.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-danger btn-sm"
                                                onclick="return confirm('Delete this use case?')">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">CRC Cards</h5>
                    <a th:href="@{/crc/create/{id}(id=${project.id})}" class="btn btn-primary btn-sm">+ Add</a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover table-bordered text-center mb-0">
                        <thead>
                            <tr>
                                <th>Class Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
							<tr th:if="${#lists.isEmpty(crcCards)}">
								<td colspan="2" class="text-muted">No crc cards yet.</td>
							</tr>
							<tr th:each="crc : ${crcCards}">
								<td class="align-middle" th:text="${crc.name}">Crc Card Name</td>
								<td class="align-middle">
									<a th:href="@{/crc/view/{id}(id=${crc.id})}" class="btn btn-primary btn-sm">View</a>
							        <form th:action="@{/crc/delete/{id}(id=${crc.id})}" method="post" class="d-inline">
							        	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
							        	<button type="submit" class="btn btn-danger btn-sm"
							            	onclick="return confirm('Delete this use case?')">Delete</button>
							  		</form>
								</td>
							</tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
		<div class="card shadow-sm mb-4">
		    <div class="card-header"><h5 class="mb-0">Diagram Generation</h5></div>
		    <div class="card-body">
		        <a th:href="@{/project/diagram/{id}(id=${project.id}, type='usecase')}"
		           class="btn btn-secondary btn-sm mr-1">Use Case Diagram</a>
		        <a th:href="@{/project/diagram/{id}(id=${project.id}, type='crc')}"
		           class="btn btn-secondary btn-sm">CRC Class Diagram</a>
		    </div>
		</div>
    </div>

    <a th:href="@{/project/dashboard}" class="btn btn-outline-secondary mb-4">&larr; Back to Projects</a>
</div>
</body>
</html>
