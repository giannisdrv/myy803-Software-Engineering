<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">
    <title>Project Dashboard</title>
</head>
<body>
<div class="container mt-4">
    <h2>Welcome to Project Dashboard</h2>
    <hr>

	<a th:href="@{/project/create_project}" class="btn btn-primary btn-sm mb-3">Create Project</a>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Project List</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-bordered text-center mb-0">
                <thead>
                    <tr>
                        <th>Project Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="project : ${projects}"
                        th:ondblclick="|window.location.href='@{/project/}' + '${project.id}'|"
                        style="cursor: pointer;">
                        <td class="fw-bold align-middle" th:text="${project.name}">Project Name</td>
                        <td class="align-middle">
							<a th:href="@{/project/view_project/{id}(id=${project.id})}" 
							       class="btn btn-primary btn-sm">View Project</a>
                            <form th:action="@{/project/delete/{id}(id=${project.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this project?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
	<a th:href="@{/user/dashboard}" class = "btn btn-outline-secondary mb-4">&larr; Back to User Dashboard</a>
</div>
</body>
</html>
