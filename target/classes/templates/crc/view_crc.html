<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">
    <title>View Crc Card</title>
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${crc.name}">Crc Card Name</h2>
    <hr>

    <div class="card shadow-sm mb-4">
        <div class="card-header"><h5 class="mb-0">Details</h5></div>
        <div class="card-body">
			<p><strong>Class Name:</strong></p>
				<div th:if="${param.edit == null or param.edit[0] != 'name'}">
			    	<p class="ms-3" style="white-space: pre-wrap;" th:text="${crc.name}"></p>
			        <a th:href="@{/crc/view/{id}(id=${crc.id}, edit='name')}"
			        	class="btn btn-sm btn-outline-primary mr-1">Edit</a>
			        <form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post" class="d-inline">
			            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			            <input type="hidden" name="field" value="name"/>
			            <input type="hidden" name="value" value=""/>
			            <button type="submit" class="btn btn-sm btn-outline-danger"
			            	onclick="return confirm('Clear this field?')">Clear</button>
			        </form>
			    </div>
				<div th:if="${param.edit != null and param.edit[0] == 'name'}">
					<form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post">
				    	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				        <input type="hidden" name="field" value="name"/>
				        <input type="text" name="value" class="form-control mb-2 col-6"
				        	th:value="${crc.name}"/>
				        <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
				        <a th:href="@{/crc/view/{id}(id=${crc.id})}"
				        	class="btn btn-sm btn-secondary">Cancel</a>
				    </form>
				</div>
				<hr>
				
            <p><strong>Responsibilities:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'responsibilities'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${crc.responsibilities}"></p>
                <a th:href="@{/crc/view/{id}(id=${crc.id}, edit='responsibilities')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="responsibilities"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'responsibilities'}">
                <form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="responsibilities"/>
                    <input type="text" name="value" class="form-control mb-2 col-6"
                           th:value="${crc.responsibilities}"/>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/crc/view/{id}(id=${crc.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>
            <hr>
            <p><strong>Collaborations:</strong></p>
            <div th:if="${param.edit == null or param.edit[0] != 'collaborations'}">
                <p class="ms-3" style="white-space: pre-wrap;" th:text="${crc.collaborations}"></p>
                <a th:href="@{/crc/view/{id}(id=${crc.id}, edit='collaborations')}"
                   class="btn btn-sm btn-outline-primary mr-1">Edit</a>
                <form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="collaborations"/>
                    <input type="hidden" name="value" value=""/>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Clear this field?')">Clear</button>
                </form>
            </div>
            <div th:if="${param.edit != null and param.edit[0] == 'collaborations'}">
                <form th:action="@{/crc/update/{id}(id=${crc.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="field" value="collaborations"/>
                    <textarea name="value" class="form-control mb-2 col-6" rows="3"
                              th:text="${crc.collaborations}"></textarea>
                    <button type="submit" class="btn btn-sm btn-primary mr-1">Save</button>
                    <a th:href="@{/crc/view/{id}(id=${crc.id})}"
                       class="btn btn-sm btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
	
	<div class="card shadow-sm mb-4">
	    <div class="card-header"><h5 class="mb-0">Linked Use Cases</h5></div>
	    <div class="card-body p-0">
	        <table class="table table-hover table-bordered text-center mb-0">
	            <thead>
	                <tr><th>Use Case Name</th><th>Action</th></tr>
	            </thead>
	            <tbody>
	                <tr th:if="${#lists.isEmpty(linkedUseCases)}">
	                    <td colspan="2" class="text-muted">No linked use cases.</td>
	                </tr>
	                <tr th:each="uc : ${linkedUseCases}">
	                    <td class="align-middle" th:text="${uc.name}"></td>
	                    <td class="align-middle">
							<form th:action="@{/crc/unlink/{crcId}(crcId=${crc.id})}" method="post" class="d-inline">
							    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
							    <input type="hidden" name="useCaseId" th:value="${uc.id}"/>
							    <button type="submit" class="btn btn-danger btn-sm"
							            onclick="return confirm('Unlink this use case?')">Unlink</button>
							</form>
	                    </td>
	                </tr>
	            </tbody>
	        </table>
	    </div>
	    <div class="card-footer" th:if="${!#lists.isEmpty(projectUseCases)}">
			<form th:action="@{/crc/link/{crcId}(crcId=${crc.id})}" method="post">
	            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
	            <label><strong>Link Use Case</strong></label>
	            <select name="useCaseId" class="form-control mb-2 col-6" required>
	                <option value="" disabled selected>Select a use case...</option>
	                <option th:each="uc : ${projectUseCases}" th:value="${uc.id}" th:text="${uc.name}"></option>
	            </select>
	            <button type="submit" class="btn btn-secondary btn-sm">+ Link</button>
	        </form>
	    </div>
	</div>

    <a th:href="@{/project/view_project/{id}(id=${crc.project.id})}"
       class="btn btn-outline-secondary mb-4">&larr; Back to Project</a>

</div>
</body>
</html>
